schemaVersion: 1
# Configuration payante plafonnée (annulation de la bascule zéro coût du 2026-11-06,
# décision 2026-11-08). Les comptes et les clés sont à ouvrir par Mickaël ; cost-guard.sh
# arrête le worker au plafond mensuel de 30 $ (pour le mois UTC), avec une alerte à 24 $.
#
# Mandat du 2026-11-07 : passer à CINQ moteurs pour J0, Mistral inclus. Elmo 0.7.7 choisit
# les moteurs PAR MARQUE : avec un panel entièrement anglophone, Mistral répondra aussi aux
# questions en anglais, et les réponses seront conservées puis rapportées (reportLanguages
# = en pour Mistral sur ce sujet). Décision de ne pas exclure, pour que la comparaison des
# cinq moteurs soit homogène sur J0.
#
# Décisions du 2026-11-07 : API directe partout où Elmo 0.7.7 la gère (OpenAI, Anthropic,
# Mistral) ; Jev en direct chez TypeSafe. Gemini et Perplexity passent par OpenRouter (seule
# voie dans Elmo), retenu par Mickaël avec 5 $ de crédit et une clé plafonnée à 5 $ par mois.
# J0 sur cinq moteurs. Voir FOURNISSEURS.md § 0 quater.
engines:
  - { model: chatgpt,    collection: api, webSearch: true, note: "OpenAI en direct (:online, outil web_search)" }
  - { model: claude,     collection: api, webSearch: true, note: "Anthropic en direct, claude-sonnet-5-5 (:online, outil web_search)" }
  - { model: gemini,     collection: api, webSearch: true, note: "via OpenRouter, google/gemini-3-flash-preview (recherche Google native)" }
  - { model: perplexity, collection: api, webSearch: true, note: "via OpenRouter, perplexity/sonar" }
  # Grok : PAS pour J0 (décision 2026-11-07). Candidat pour une fenêtre ultérieure, avec sa
  # propre mesure de départ : l'ajouter à une fenêtre en cours casserait la comparaison avec J0.
  # Via OpenRouter seulement dans Elmo 0.7.7 (x-ai/grok-4.5, seul Grok testé par Elmo).
  # - { model: grok,       collection: api, webSearch: true, note: "via OpenRouter, x-ai/grok-4.5" }
  - { model: mistral,    collection: api, webSearch: true, note: "Mistral en direct, mistral-large-4 (Conversations API + outil web_search). Mesuré en anglais pour le pilote J0 (langue unique du panel)." }
# Jev en direct chez TypeSafe (TYPESAFE_API_KEY, décision 2026-11-07 — voir elmo/.env.example).
windows:
  - id: j0
    kind: baseline
    days: 5
    panelVersion: 2
    status: running
    start: "2026-11-07"
    runTimeUtc: "15:27"
    targets:
      - chatgpt:openai-api:gpt-6-luna:online
      - claude:anthropic-api:claude-sonnet-5-5:online
      - mistral:mistral-api:mistral-large-4:online
      - gemini:openrouter:google/gemini-3-flash-preview:online
      - perplexity:openrouter:perplexity/sonar:online
    note: "Mesure de départ, 5 moteurs (3 directs + Gemini et Perplexity via OpenRouter). Dates fixées au démarrage du worker, après validation du panel. Démarrée le 2026-11-07 à 15:27 UTC (démarrage du worker). Perturbation jour 1 : worker arrêté par erreur de 15:28:20 à 17:20:16 UTC (test de cost-guard.sh à blanc qui arrêtait le vrai worker ; correctif bc7a230) ; 3 runs Mistral et des jugements de Jev retardés, terminés à la relance ; premier passage complet (50/50, jugés 50/50), aucun jour manquant. Gel rompu, J0 conservé (décision de Mickaël, 2026-11-07) : le 7 nov. à 08:54 UTC, 710b4dd publie les quatre pages de service (noindex retiré, entrée dans le sitemap) ; à 09:24 UTC, d89380b ajoute une section à la page padel ; pendant la fenêtre, à 15:56 UTC (29 min après le démarrage), a7ac6a7 réécrit le texte « About » de la page d'accueil. J0 mesure donc un site en transition d'indexation (pages de service indexables depuis quelques heures au démarrage). Gel rétabli jusqu'à la fin de la fenêtre. Concurrents d'Elmo changés le 2026-11-08 (décision de Mickaël), en deux temps : à 08:28 UTC (première liste, remplacée), puis à 08:43 UTC par la liste validée en cinq segments (20 concurrents : subject.yaml et concurrents-candidats.yaml, section candidates). Playtomic supprimé ; les académies de padel sont des lieux où Gari travaille, pas des concurrents (section lieux, non chargées dans Elmo). Seuls les concurrents changent (marque, questions, moteurs et heure inchangés). Les étiquettes de concurrents d'Elmo changent donc à cette date : les réponses antérieures gardent celles de l'ancienne liste (Playtomic, Ultimate Performance, Future, Caliber), les suivantes portent la nouvelle. Le rapport J0 recompte toute la fenêtre avec cette liste (scripts/j0-reanalysis.sh avec concurrents-candidats.yaml, sur les réponses complètes ; lieux de travail comptés à part), et non avec les étiquettes d'Elmo. Listes d'Elmo avant chaque changement : ~/oia-visibility-data/coach-gari/elmo-concurrents-avant-2026-11-08.json et elmo-concurrents-avant-2026-11-08b.json."
  # Remesure (mandat v7, bloc E) : identique à J0 (mêmes questions, moteurs, modèles, heure,
  # cinq jours). Début à fixer par Mickaël, au moins trois semaines après la publication des
  # correctifs de P2 (p2/decisions.md). Grok n'y entre pas : candidat pour sa propre mesure
  # de départ, hors comparaison avec J0.
  - id: j1
    kind: follow-up
    comparesWith: j0
    days: 5
    panelVersion: 2
    status: planned
    runTimeUtc: "15:27"
    targets:
      - chatgpt:openai-api:gpt-6-luna:online
      - claude:anthropic-api:claude-sonnet-5-5:online
      - mistral:mistral-api:mistral-large-4:online
      - gemini:openrouter:google/gemini-3-flash-preview:online
      - perplexity:openrouter:perplexity/sonar:online
    note: "Remesure après les correctifs de P2. Début à fixer par Mickaël (au moins trois semaines après leur publication). Mêmes questions, moteurs, modèles et heure que J0 ; mistral-large-4 conservé pour comparer à l'identique, bien qu'il ne renvoie pas ses sources (décision de Mickaël, 2026-11-07). J0 ayant mesuré un site en transition d'indexation (gel rompu le 7 nov.), les gains de la remesure ne pourront pas être attribués aux seuls correctifs de P2. Grok : candidat pour sa propre mesure de départ, hors comparaison."
freezes:
  - id: freeze-j0
    scope: [site, repository]
    rule: "Le site ne publie rien qui change ce que voient Google et les assistants IA avant la fin de la fenêtre J0."
    untilEndOfWindow: j0
    covers:
      - "Pages publiques : texte, titres, meta, données structurées (JSON-LD), images et attributs alt"
      - "Indexabilité : noindex / index, robots.txt, sitemap.xml, canonicals, redirections, en-têtes HTTP"
      - "Nouvelles pages ou pages retirées, y compris la publication des pages de service en brouillon (plan, action 1.2)"
      - "Fichiers lus par les IA : llms.txt (plan, action 2.8), prix ajoutés au HTML (plan, action 2.1)"
      - "Annonces aux moteurs : soumission IndexNow, sitemap ou URL dans Search Console / Bing Webmaster Tools"
      - "Réglages du pare-feu ou de la protection anti-bots de l'hébergeur"
    allowed:
      - "Travail sur une branche non déployée en production"
      - "Back-office et code qui ne modifient aucune page publique ni aucun en-tête public"
      - "Correctif de sécurité urgent : autorisé, à consigner dans le journal de la fenêtre comme perturbation"
    decidedBy: "Mickaël THOMAS"
    decidedAt: "2026-11-05"
