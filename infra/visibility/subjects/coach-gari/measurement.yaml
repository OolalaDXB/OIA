schemaVersion: 1
# Configuration payante plafonnée (annulation de la bascule zéro coût du 2026-11-06,
# décision 2026-11-08). Les comptes et les clés sont à ouvrir par Mickaël ; cost-guard.sh
# arrête le worker au plafond mensuel de 30 $ (pour le mois UTC), avec une alerte à 24 $.
#
# Mandat du 2026-11-07 : passer à CINQ moteurs pour J0, Mistral inclus. Elmo 0.7.7 choisit
# les moteurs PAR MARQUE : avec un panel entièrement anglophone, Mistral répondra aussi aux
# questions en anglais, et les réponses seront conservées puis rapportées (reportLanguages
# = en pour Mistral sur ce sujet). Décision de ne pas exclure, pour que la comparaison des
# cinq moteurs soit homogène sur J0.
#
# Décisions du 2026-11-07 : API directe partout où Elmo 0.7.7 la gère (OpenAI, Anthropic,
# Mistral) ; Jev en direct chez TypeSafe. Gemini et Perplexity passent par OpenRouter (seule
# voie dans Elmo), retenu par Mickaël avec 5 $ de crédit et une clé plafonnée à 5 $ par mois.
# J0 sur cinq moteurs. Voir FOURNISSEURS.md § 0 quater.
engines:
  - { model: chatgpt,    collection: api, webSearch: true, note: "OpenAI en direct (:online, outil web_search)" }
  - { model: claude,     collection: api, webSearch: true, note: "Anthropic en direct, claude-sonnet-5-5 (:online, outil web_search)" }
  - { model: gemini,     collection: api, webSearch: true, note: "via OpenRouter, google/gemini-3-flash-preview (recherche Google native)" }
  - { model: perplexity, collection: api, webSearch: true, note: "via OpenRouter, perplexity/sonar" }
  # Grok : PAS pour J0 (décision 2026-11-07). Candidat pour une fenêtre ultérieure, avec sa
  # propre mesure de départ : l'ajouter à une fenêtre en cours casserait la comparaison avec J0.
  # Via OpenRouter seulement dans Elmo 0.7.7 (x-ai/grok-4.5, seul Grok testé par Elmo).
  # - { model: grok,       collection: api, webSearch: true, note: "via OpenRouter, x-ai/grok-4.5" }
  - { model: mistral,    collection: api, webSearch: true, note: "Mistral en direct, mistral-large-4 (Conversations API + outil web_search). Mesuré en anglais pour le pilote J0 (langue unique du panel)." }
# Jev en direct chez TypeSafe (TYPESAFE_API_KEY, décision 2026-11-07 — voir elmo/.env.example).
windows:
  - id: j0
    kind: baseline
    days: 5
    panelVersion: 2
    status: planned
    note: "Mesure de départ, 5 moteurs (3 directs + Gemini et Perplexity via OpenRouter). Dates fixées au démarrage du worker, après validation du panel."
freezes:
  - id: freeze-j0
    scope: [site, repository]
    rule: "Le site ne publie rien qui change ce que voient Google et les assistants IA avant la fin de la fenêtre J0."
    untilEndOfWindow: j0
    covers:
      - "Pages publiques : texte, titres, meta, données structurées (JSON-LD), images et attributs alt"
      - "Indexabilité : noindex / index, robots.txt, sitemap.xml, canonicals, redirections, en-têtes HTTP"
      - "Nouvelles pages ou pages retirées, y compris la publication des pages de service en brouillon (plan, action 1.2)"
      - "Fichiers lus par les IA : llms.txt (plan, action 2.8), prix ajoutés au HTML (plan, action 2.1)"
      - "Annonces aux moteurs : soumission IndexNow, sitemap ou URL dans Search Console / Bing Webmaster Tools"
      - "Réglages du pare-feu ou de la protection anti-bots de l'hébergeur"
    allowed:
      - "Travail sur une branche non déployée en production"
      - "Back-office et code qui ne modifient aucune page publique ni aucun en-tête public"
      - "Correctif de sécurité urgent : autorisé, à consigner dans le journal de la fenêtre comme perturbation"
    decidedBy: "Mickaël THOMAS"
    decidedAt: "2026-11-05"
