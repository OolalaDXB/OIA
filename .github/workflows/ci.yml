name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The registry and the knowledge base carry honesty rules Zod cannot express
      # (a claimed owner sign-off must be dated; a hypothesis must state its source;
      # discovery must be answerable). A broken one is a broken product.
      - run: pnpm --filter @oia/registry validate
      - run: pnpm --filter @oia/knowledge validate
      # Catch a broken console here rather than on Vercel.
      - run: pnpm --filter @oia/web build
