name: Discovery refresh

# The product promises opportunities that are *currently* actionable. That
# promise decays on its own: a shortlist captured in August is wrong in October.
# Refreshing it needs network egress, which the agent sandbox does not have and
# a laptop only has when it is open — so it runs here, on a schedule.
#
# This is the automation of the step the run book already described by hand
# (`docker compose up` → `ted-to-console` → commit → Vercel redeploys). It only
# ever touches generated data files, and it refuses to commit a dataset that
# fails the test suite.
#
# To stop it: disable this workflow in the repository's Actions tab.

on:
  schedule:
    # Mondays 06:00 UTC — the queue is fresh before the week starts.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      projects:
        description: "Comma-separated project slugs (empty = every discoverable project)"
        required: false
        default: ""
      publishedSince:
        description: "Recency floor, YYYYMMDD (empty = last 90 days)"
        required: false
        default: ""
      maxNotices:
        description: "Max notice pages to fetch and qualify"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: discovery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Searches asked for from the console. Claimed here (QUEUED -> RUNNING) so
      # a second run cannot cover the same request twice, and closed at the end
      # against what actually happened — a request is never reported as searched
      # unless a search ran.
      - name: Claim the searches the console asked for
        id: requested
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::No Supabase credentials — searches requested from the console were not read. See docs/access-and-data.md."
            echo "projects=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --filter @oia/workers requests -- --plan

      # Explicit input wins; otherwise the console's requests decide; otherwise
      # every project whose registry entry enables discovery.
      - name: Decide which projects this run covers
        id: scope
        run: |
          PROJECTS="${{ inputs.projects }}"
          if [ -z "$PROJECTS" ]; then PROJECTS="${{ steps.requested.outputs.projects }}"; fi
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          if [ -n "$PROJECTS" ]; then
            echo "Covering: $PROJECTS"
          else
            echo "Covering every project with discovery enabled."
          fi

      - name: Show the discovery plan
        run: |
          if [ -n "${{ steps.scope.outputs.projects }}" ]; then
            pnpm --filter @oia/workers discover:ted -- --list --project "${{ steps.scope.outputs.projects }}"
          else
            pnpm --filter @oia/workers discover:ted -- --list
          fi

      - name: Discover (one expert query per project)
        env:
          TED_MAX: ${{ inputs.maxNotices || '25' }}
          # Left unset when the input is blank. Passing an empty string here is
          # what silently removed the recency floor from every query on the
          # first real run: the worker treated "" as a value rather than as
          # "not given". The worker now guards against it too — both, because
          # this is the kind of bug that comes back.
          TED_PUBLISHED_SINCE: ${{ inputs.publishedSince || '' }}
        run: |
          if [ -n "${{ steps.scope.outputs.projects }}" ]; then
            pnpm --filter @oia/workers discover:ted -- --project "${{ steps.scope.outputs.projects }}"
          else
            pnpm --filter @oia/workers discover:ted
          fi

      # Links pasted from the console, and pages nobody has a connector for.
      # Runs before the console is rebuilt so a newly ingested call is in it.
      - name: Drain the request queue (links pasted from the console)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::No Supabase credentials — pasted links and project drafts were not processed."
            exit 0
          fi
          pnpm --filter @oia/workers requests

      # Applying a project draft writes YAML, and the browser reads a generated
      # snapshot of it. Regenerating here is what keeps the drift test in the
      # next step a real check rather than a guaranteed failure.
      - name: Regenerate and validate the registry
        run: |
          pnpm --filter @oia/registry generate
          pnpm --filter @oia/registry validate

      - name: Rebuild the console dataset
        run: pnpm --filter @oia/workers exec tsx src/ted-to-console.ts

      # A refresh that breaks the suite must not reach the console. The data is
      # the product; shipping a dataset the invariants reject would be worse
      # than shipping last week's.
      - name: Verify before publishing
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @oia/web build

      # Fold the run into the permanent ledger and raise alerts. Skipped with a
      # clear message when the credentials are absent, rather than failing the
      # whole refresh: the committed dataset is still worth publishing.
      - name: Publish to the watch ledger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — the ledger was not updated and no alert was raised. See docs/access-and-data.md."
            exit 0
          fi
          if [ -n "${{ steps.scope.outputs.projects }}" ]; then
            pnpm --filter @oia/workers publish:watch -- --project "${{ steps.scope.outputs.projects }}"
          else
            pnpm --filter @oia/workers publish:watch
          fi

      # Every published link, actually requested. A 404 in a shortlist is the
      # fastest way to lose trust in the whole thing, and this is also the only
      # place with the egress to find out. It stamps the registry with what it
      # verified — and refuses to stamp anything if its own egress is blocked,
      # rather than blaming other people's sites for our network.
      - name: Check every published link
        id: links
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm --filter @oia/workers check:links
          # The stamp lands in YAML; the snapshot the browser reads must follow it.
          pnpm --filter @oia/registry generate

      - name: Commit the refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/console.json outputs/sprint-1 registry/sources registry/projects \
                  packages/registry/src/snapshot.json packages/registry/src/sources.snapshot.json
          if git diff --cached --quiet; then
            echo "No change in the discovered set — nothing to publish."
            exit 0
          fi
          RECORDS=$(node -e "console.log(require('./apps/web/src/data/console.json').run.records)")
          git commit -m "data: scheduled discovery refresh (${RECORDS} records)" \
                     -m "Automated run of discover:ted across every project with discovery enabled, then ted-to-console. Typecheck, tests and the web build passed against this dataset before it was committed."
          git push

      # Close the claimed requests against the real outcome. `always()`, because
      # a request left RUNNING forever is indistinguishable from one still in
      # flight, and the console would keep saying "searching".
      - name: Close the searches the console asked for
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then
            pnpm --filter @oia/workers requests -- --settle=success
          else
            pnpm --filter @oia/workers requests -- --settle=failure
          fi

      - name: Run report
        if: always()
        run: |
          cat outputs/sprint-1/run-report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat outputs/link-check/report.md >> "$GITHUB_STEP_SUMMARY" || true
