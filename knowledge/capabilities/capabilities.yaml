  synonyms: [pseudonymisation, protection des donnees]
  provenance: *code

- id: mcp-gateway-enforcement
  name: "MCP gateway enforcement (forwarding & adapters)"
  description: >-
    The enforcement half of BAWABA: real forwarding of governed MCP tool calls
    to upstream backends, third-party gateway adapters, embedded sovereign
    mode. Pipeline orchestration (authenticate → evaluate → tokenize → route →
    execute → audit) is implemented; the terminal execution step is a stub.
  category: ai-governance
  technicalCapabilities: ["6-stage fail-closed pipeline orchestration (real)", "MCP JSON-RPC 2.0 reverse proxy shell"]
  businessCapabilities: ["AI gateway control (target)"]
  status: EXPERIMENTAL
  maturity: DECLARED
  usedBy: [bawaba]
  implementations: ["OolalaDXB/bawaba-command internal/proxy/proxy.go (execution stubbed at :463)"]
  evidenceIds: []
  limitations:
    - "executeToolCall returns simulated responses — no upstream MCP backend is ever contacted. NEVER claim live enforcement to real backends."
    - "Zero third-party gateway adapters (Kong/Envoy/LiteLLM…); embedded sovereign mode is roadmap P3; OIDC/JWT auth is a stub; no TLS listener as deployed."
  keywords: [gateway, enforcement, mcp, proxy, adapters, sidecar, overlay]
  synonyms: [passerelle, adaptateurs]
  provenance: *code

