- id: decision-api
  name: "Policy decision engine (default-deny)"
  description: >-
    Default-deny policy evaluation for AI agent tool calls (per-agent YAML
    allow/deny lists, wildcard matching, deny precedence), evaluated in-process
    by the BAWABA gateway pipeline with full audit emission.
  category: ai-governance
  technicalCapabilities: ["default-deny policy evaluation", "per-agent tool allowlists", "decision audit emission"]
  businessCapabilities: ["AI governance", "enterprise AI control"]
  status: EXPERIMENTAL
  maturity: TESTED
  usedBy: [bawaba]
  implementations: ["OolalaDXB/bawaba-command internal/policy/policy.go (+ proxy pipeline)"]
  evidenceIds: [ev-bawaba-go-tests]
  limitations:
    - "Binary ALLOW/DENY only — no REVIEW tri-state; no standalone external decision endpoint (in-process only)."
    - "Static YAML pre-OPA MVP: no policy DSL, no attribute/context-based evaluation."
    - "Policy tests exist but are excluded from CI (run locally)."
  keywords: [ai governance, decision, policy, enforcement, gateway, agent control, guardrails]
  synonyms: [gouvernance ia, controle des agents]
  provenance: &code
    sourceType: CODE_REPOSITORY
    sourceId: "OolalaDXB/bawaba-command@9913a36"
    confidence: 0.95
    createdAt: "2026-08-14"
    updatedAt: "2026-08-14"

- id: evidence-audit-plane
  name: "Tamper-evident audit & evidence plane"
  description: >-
    Hash-chained (SHA-256), Ed25519-signed append-only audit trail with a
    Postgres immutability trigger, server-side chain verification endpoint,
    evidence export and a CLI verifier. A public evidence sample verifies
    independently (verify.py: chain OK, signature OK). BAWABA's strongest
    subsystem.
  category: audit
  technicalCapabilities: ["SHA-256 hash chain", "Ed25519 signing", "append-only Postgres trigger", "server-side chain verification", "evidence export + CLI verifier", "SSE event stream", "SIEM webhook forwarding"]
  businessCapabilities: ["auditability", "verifiable evidence", "compliance support"]
  status: INTERNAL
  maturity: TESTED
  usedBy: [bawaba]
  implementations: ["OolalaDXB/bawaba-command internal/audit/ + internal/api/ + cmd/cli/"]
  evidenceIds: [ev-bawaba-go-tests, ev-bawaba-public-evidence-sample]
  limitations:
    - "computeEventHash covers 14 of ~24 event fields — some fields (routing_proof, mcp_server…) are mutable without breaking the chain."
    - "Merkle window is roadmap P2; audit tests excluded from CI (run locally)."
  keywords: [audit, audit trail, evidence, provenance, traceability, logging, compliance, tamper-evident]
  synonyms: [tracabilite, piste d'audit, preuve]
  provenance: *code

