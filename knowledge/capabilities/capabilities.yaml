  keywords: [sovereignty, sovereign, jurisdiction, routing, data residency, compliance]
  synonyms: [souverainete, residence des donnees]
  provenance: *code

- id: pii-tokenization-mena
  name: "MENA PII tokenization"
  description: >-
    Rust tokenizer (cgo FFI) detecting and tokenizing MENA-relevant PII —
    IBAN, email, phone, Emirates ID, card (Luhn), KSA NID, Morocco CIN — with
    a TTL token vault and detokenization.
  category: security
  technicalCapabilities: ["regex PII detection (7 patterns)", "TTL token vault", "detokenization", "cgo FFI bridge"]
  businessCapabilities: ["PII protection", "regulated-data handling"]
  status: EXPERIMENTAL
  maturity: IMPLEMENTED
  usedBy: [bawaba]
  implementations: ["OolalaDXB/bawaba-command rust/tokenizer/ + internal/tokenizer/"]
  evidenceIds: [ev-bawaba-go-tests]
  limitations:
    - "Regex patterns are broad/naive (false positives likely, e.g. Morocco CIN); only 1 Rust test — regexes and vault untested."
    - "Tokenization is per-agent opt-in config, not a global invariant."
