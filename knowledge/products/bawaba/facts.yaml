- id: fact-bawaba-control-plane-real
  statement: >-
    Implemented and locally tested in bawaba-command: default-deny policy
    engine (YAML tool lists), tamper-evident audit chain (SHA-256 + Ed25519 +
    Postgres append-only trigger, server-side verification endpoint),
    Ed25519-signed jurisdiction routing proofs (third-party verifiable), MENA
    PII tokenization (Rust, 7 patterns + Luhn), 16-endpoint REST API with SSE,
    quotas/rate limiting, SIEM webhook forwarder, CLI evidence verifier. A
    public evidence sample on bawaba.systems verifies successfully
    (verify.py: chain OK, signature OK).
  subject: bawaba
  lifecycle: CANONICAL
  disclosure: EXTERNAL_OK
  provenance:
    sourceType: CODE_REPOSITORY
    sourceId: "OolalaDXB/bawaba-command@9913a36"
