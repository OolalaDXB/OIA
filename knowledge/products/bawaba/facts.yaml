- id: fact-bawaba-p4-real-enforcement
  statement: >-
    P4 shipped (bawaba-command@bde954b): REAL enforcement path. Allowed
    tool calls are forwarded as JSON-RPC to configured upstream MCP
    backends (upstreams: in bawaba.yaml, per-upstream env URL override);
    a tool served by no upstream is refused explicitly — the simulated
    '{status: executed}' response is gone. A real separate-process demo
    backend (invoice/payment ledger, own container, GET /ledger) proves
    the asymmetry: ALLOW lands a real payment record, DENY never reaches
    the process. Upstream errors surface as -32006 + tool_error audit
    events; audit MCPServer carries the real upstream name. STILL NOT
    implemented: third-party gateway adapters (Kong/Envoy/LiteLLM),
    OIDC/JWT auth (stub), native TLS (Caddy fronting documented in
    RUNBOOK_PUBLIC_DEMO.md), embedded sovereign mode, /metrics, tri-state
    REVIEW decisions. Public deployment: code-ready, runbook written —
    blocked only on operator-provided VPS + DNS.
  subject: bawaba
  lifecycle: REVIEWED
  disclosure: INTERNAL_ONLY
  provenance:
    sourceType: CODE_REPOSITORY
    sourceId: "OolalaDXB/bawaba-command@bde954b"
