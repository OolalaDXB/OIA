    confidence: 0.95
    createdAt: "2026-08-14"
    updatedAt: "2026-08-14"
    approvedBy: "mickael (chat approval 2026-08-14)"

- id: fact-bawaba-enforcement-not-implemented
  statement: >-
    NOT implemented in bawaba-command: real gateway forwarding (executeToolCall
    returns simulated responses — no upstream MCP backend is ever contacted),
    third-party gateway adapters (Kong/Envoy/LiteLLM/etc.: zero code),
    embedded sovereign mode (roadmap P3), OIDC/JWT auth (explicit stub), TLS
    listener as deployed, /metrics endpoint (Prometheus configs scrape a
    non-existent target), REVIEW tri-state decisions (policy contract is
    binary allow/deny, no external decision endpoint). Never present
    enforcement to real backends as working.
  subject: bawaba
