- id: fact-bawaba-p3-souffleur-share
  statement: >-
    P3 shipped (bawaba-command@393629d): (1) shareable workspace URL —
    /join#payload carries the ephemeral session (id + clone keys) in the URL
    fragment only (never reaches any server), validated against the gateway
    before adoption; the P2 security debt is closed via BAWABA_PUBLIC_DEMO,
    which restricts control-plane mutations to -demo- workspace clones and
    makes routing rules read-only on a public host. (2) Souffleur (product name; renamed from Copilot @afa71bb — the theater
    prompter: whispers the script, never acts; name stays French in all
    languages) —
    translation-only over real decision records (matched_rule,
    policy_version, policy_result loaded server-side from the audit trail),
    provider-agnostic from the start: Anthropic Messages API, and any
    OpenAI-compatible endpoint (Mistral, self-hosted vLLM/Ollama = sovereign
    option), zero vendor SDK dependency. No provider configured → honest
    503; the Souffleur never decides and never invents. DEMONSTRATED
    end-to-end 2026-08-15: first live run on Mistral (mistral-large-latest)
    faithfully translated a real deny record (denied_tools.execute_payment,
    policy v1.0.0) in the Guided Demo — browser → gateway → audit trail →
    Souffleur. Answers follow the reviewer's UI language (fr/en) since
    @3b506cd. The browser demo path itself only became real the same day:
    missing CORS on :8080/:8081 and deny-as-exception handling had blocked
    it (fixed @99a0a1f/@10c05ec/@3b506cd); earlier curl-based checks had
    masked this.
  subject: bawaba
